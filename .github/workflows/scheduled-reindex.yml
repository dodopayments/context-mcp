name: Scheduled Documentation Reindex

# Daily incremental reindex; content-hash manifest persisted via GitHub Actions
# cache across runs (no external credentials required).
# Dispatch with full=true to force a clear+rebuild.

on:
  schedule:
    - cron: '0 2 * * *' # daily, 2 AM UTC
  workflow_dispatch:
    inputs:
      full:
        description: 'Force a FULL reindex (clear + rebuild, reseed manifest)'
        type: boolean
        default: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm clean-install

      - name: Restore manifest from cache
        if: ${{ inputs.full != true }}
        uses: actions/cache/restore@v4
        with:
          path: data/reindex-manifest.json
          key: reindex-manifest-${{ github.run_id }}
          restore-keys: |
            reindex-manifest-

      - name: Reindex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            npm run reindex:dodo
          else
            npm run reindex:dodo -- --incremental
          fi

      - name: Save manifest to cache
        if: ${{ success() }}
        uses: actions/cache/save@v4
        with:
          path: data/reindex-manifest.json
          key: reindex-manifest-${{ github.run_id }}
