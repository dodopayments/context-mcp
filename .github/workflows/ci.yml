name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Quality checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        # Non-blocking until the existing formatting drift on main is cleaned up
        run: npm run format:check
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  check-server:
    name: Node server checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    # packages/template/server is intentionally NOT an npm workspace (it ships
    # its own lockfile so its Dockerfile can `npm ci` from a self-contained
    # build context - see packages/template/server/README.md). That means the
    # root `check` job's `npm ci` / `npm test` never touch it. Check it here
    # instead, so its tests (including the search-core drift guard) and
    # typecheck actually run in CI rather than only on a contributor's machine.
    defaults:
      run:
        working-directory: packages/template/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/template/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
