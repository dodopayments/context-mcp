name: Scheduled Documentation Reindex

# Daily incremental reindex; content-hash manifest persisted via GitHub Actions
# cache across runs (no external credentials required).
# Dispatch with full=true to force a clear+rebuild.

on:
  schedule:
    - cron: '0 2 * * *' # daily, 2 AM UTC
  workflow_dispatch:
    inputs:
      full:
        description: 'Force a FULL reindex (clear + rebuild, reseed manifest)'
        type: boolean
        default: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Some sources in config.yaml live in private repos (e.g. dodopayments/dodo-docs).
      # The built-in GITHUB_TOKEN is scoped to *this* repository, so it cannot clone
      # them; without a usable token the clone 403s and the whole reindex fails.
      #
      # Mint a short-lived installation token from the org's GitHub App instead. It is
      # scoped to the org rather than an explicit repository list because config.yaml
      # clones every SDK/docs repo — a hardcoded list here would silently break the
      # reindex each time a source is added. The token is downscoped to contents:read,
      # expires in an hour, and is revoked automatically when the job ends.
      - name: Mint GitHub App token for private sources
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm clean-install

      - name: Restore manifest from cache
        if: ${{ inputs.full != true }}
        uses: actions/cache/restore@v6
        with:
          path: data/reindex-manifest.json
          key: reindex-manifest-${{ github.run_id }}
          restore-keys: |
            reindex-manifest-

      - name: Reindex
        env:
          # Consumed by the github source fetcher to authenticate private clones.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            npm run reindex:dodo
          else
            npm run reindex:dodo -- --incremental
          fi

      - name: Save manifest to cache
        if: ${{ success() }}
        uses: actions/cache/save@v6
        with:
          path: data/reindex-manifest.json
          key: reindex-manifest-${{ github.run_id }}
